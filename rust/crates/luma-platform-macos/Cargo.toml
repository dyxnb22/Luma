[package]
name = "luma-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "macOS system adapters (apps, pasteboard, AX, windows, …). Host I/O and parsing; unsafe FFI only in AX/window modules when needed."

[dependencies]
async-trait = { workspace = true }
luma-storage = { workspace = true }
luma-application = { workspace = true }
luma-domain = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
portable-pty = { workspace = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
